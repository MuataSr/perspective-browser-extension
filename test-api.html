<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
</head>
<body>
  <h1>Testing Abacus AI API</h1>
  <button onclick="testAPI()">Test API Call</button>
  <div id="output"></div>

  <script>
    async function testAPI() {
      const output = document.getElementById('output');
      output.innerHTML = 'Testing API call...';

      const apiKey = 's2_114636cbfb9b4f4194185d452c6b19f8';
      const endpoint = 'https://routellm.abacus.ai/v1/chat/completions';

      const requestBody = {
        model: 'deepseek-ai/DeepSeek-V3.2',
        messages: [
          {
            role: 'user',
            content: 'Say "Hello" in exactly 1 word.'
          }
        ],
        max_tokens: 10,
        temperature: 0.5
      };

      const startTime = Date.now();

      try {
        console.log('Starting API call at:', new Date().toISOString());
        output.innerHTML += '<br>Starting API call...';

        const controller = new AbortController();
        const timeoutId = setTimeout(() => {
          console.log('Timeout triggered after 30 seconds');
          controller.abort();
        }, 30000);

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify(requestBody),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const endTime = Date.now();
        const duration = endTime - startTime;

        console.log('Response received:', response.status);
        console.log('Duration:', duration, 'ms');

        output.innerHTML += `<br>Response status: ${response.status}`;
        output.innerHTML += `<br>Duration: ${duration}ms`;

        if (!response.ok) {
          const errorText = await response.text();
          console.error('API Error:', errorText);
          output.innerHTML += `<br><strong>Error:</strong> ${errorText}`;
          return;
        }

        const data = await response.json();
        console.log('Response data:', data);
        output.innerHTML += `<br><strong>Success!</strong>`;
        output.innerHTML += `<br>Response: ${JSON.stringify(data, null, 2)}`;

      } catch (error) {
        const endTime = Date.now();
        const duration = endTime - startTime;
        console.error('Error:', error);
        output.innerHTML += `<br><strong>Error:</strong> ${error.message}`;
        output.innerHTML += `<br>Duration before error: ${duration}ms`;
        output.innerHTML += `<br>Error name: ${error.name}`;
      }
    }
  </script>
</body>
</html>
